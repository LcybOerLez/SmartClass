<body>

<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const DAYS=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const DAYS_FULL=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const MONTHS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
/* ---------- расписание пользователя (хранится только на устройстве) ---------- */
let BELLS=[],SCHEDULE={};
const DEFAULT_MODEL='gemini-2.5-flash',GEMINI_URL='https://generativelanguage.googleapis.com/v1beta/models/';
const IMG_OK=/^image\/(png|jpe?g|webp|heic|heif)$/i;
const DEFAULT_SUBJECTS=['Математика','Алгебра','Геометрия','Русский язык','Литература','Английский язык','История','Обществознание','География','Биология','Физика','Химия','Информатика','Физкультура','Музыка','ИЗО','Технология'];
const p2=n=>String(n).padStart(2,'0');
const dayKey=w=>{w=w.toLowerCase();return /^(пн|пон)/.test(w)?1:/^(вт|вто)/.test(w)?2:/^ср/.test(w)?3:/^(чт|чет)/.test(w)?4:/^(пт|пя)/.test(w)?5:/^(сб|суб)/.test(w)?6:/^(вс|воск)/.test(w)?0:null};
const parseTimes=raw=>String(raw||'').split('\n').map(l=>l.match(/(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})/)).filter(m=>m&&+m[1]<24&&+m[3]<24&&+m[2]<60&&+m[4]<60&&(+m[1]*60+ +m[2])<(+m[3]*60+ +m[4])).map(m=>({start:p2(m[1])+':'+m[2],end:p2(m[3])+':'+m[4]}));
const parseWeek=raw=>{const out={};String(raw||'').split('\n').forEach(l=>{const m=l.match(/^\s*([A-Za-zА-Яа-яЁё]{2,})\.?\s*[:：\-–—]\s*(.*)$/);if(!m)return;const k=dayKey(m[1]);if(k==null)return;const ls=m[2].split(/[;；]/).map(x=>x.trim()).filter(Boolean);if(ls.length)out[k]=ls});return out};
const applySchedule=()=>{
  BELLS=S.bells.filter(b=>/^\d{1,2}:\d{2}$/.test(b.s)&&/^\d{1,2}:\d{2}$/.test(b.e)&&mins(b.s)<mins(b.e)).map(b=>({start:b.s,end:b.e}));
  const mk=w=>{const o={};for(let k=0;k<7;k++){const l=((S.sched[w]||{})[k]||[]).map(x=>String(x).trim()).filter(Boolean);if(l.length)o[k]=l}return o};
  const A=mk('A'),B=mk('B');SCHEDULE={A,B:Object.keys(B).length?B:A};
};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const lessonName=raw=>cap(String(raw).trim());
const lessonHas=(raw,sub)=>same(raw,sub);
const JARVIS_RU='Ты — Jarvis, ИИ-помощник приложения SmartClass. Твой единственный создатель — один человек по имени Ruslan H. Твои официальные тестировщики: igros, makler и kupii. Если спросят, кто ты, кто тебя создал или кто тебя тестировал, отвечай именно так. Никогда не называй себя названием другой модели: ты всегда Jarvis.';
const JARVIS_EN='You are Jarvis, the AI assistant of the SmartClass app. Your sole creator is one person named Ruslan H, and your official testers are igros, makler and kupii. Always refer to yourself as Jarvis and never as any other model. ';
const IMG_PROMPT=JARVIS_EN+'Read the uploaded photo (a school schedule, homework assignment, textbook page or notes). Accurately extract all text, subjects, lesson times, classrooms and tasks, then present it clearly as text for the student. Respond in Russian. Use short lines and bullet points, no tables. If the photo shows homework, list each task under its subject.';
const HW_WORDS=/упр|номер|задани|задач|д\/з|дз\b|домашн|параграф|§|стр\.|страниц|выучи|учить|прочита|пересказ|сочинени|доклад|реферат|конспект/i;
const ASK_WORDS=/\?|как |почему|объясни|помоги|подскажи|реши|что такое|зачем|поясни|не понимаю/i;

let S={tab:0,day:'',hw:store.get('sc_hw',[]),key:store.get('sc_key',''),model:DEFAULT_MODEL,ai:store.get('sc_ai',null),cls:store.get('sc_class',''),bells:store.get('sc_bells',null),sched:store.get('sc_sched',null),fc:store.get('sc_fc',true)!==false,shift:store.get('sc_shift',0),eW:'A',eD:1,img:null,chat:store.get('sc_chat',[]),draft:'',busy:false,adding:false,showKey:false};
// Модель Jarvis (Gemini): ключ sc_model_v5, по умолчанию gemini-2.5-flash
{const m0=store.get('sc_model_v5',null);S.model=(typeof m0==='string'&&/^(models\/)?gemini/i.test(m0.trim()))?m0.trim():DEFAULT_MODEL;store.set('sc_model_v5',S.model)}
if(typeof S.key!=='string'||/^sk-/.test(S.key)){S.key='';store.set('sc_key','')}
// Миграция старого текстового формата расписания в структурный
if(!Array.isArray(S.bells))S.bells=parseTimes(store.get('sc_times','')).map(b=>({s:b.start,e:b.end}));
if(!S.sched||typeof S.sched!=='object')S.sched={A:parseWeek(store.get('sc_week','')),B:{}};
if(S.ai!=='free'&&S.ai!=='gemini')S.ai=S.key?'gemini':'free';
/* ---------- утилиты ---------- */
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const fmt=d=>`${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/^[ \t]*[*-] /gm,'• ').replace(/^#{1,4}\s*(.+)$/gm,'<b>$1</b>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const ANCHOR=new Date(2026,7,31); // понедельник, с которого начинается неделя A
const weekOf=d=>{const mon=addDays(d,-((d.getDay()+6)%7));const w=Math.round((mon-ANCHOR)/6048e5);return((w+S.shift)%2+2)%2?'B':'A'};
const lessonsOn=d=>(SCHEDULE[S.fc?weekOf(d):'A']||{})[d.getDay()]||[];
const hasSched=()=>Object.keys(SCHEDULE.A||{}).length>0||Object.keys(SCHEDULE.B||{}).length>0;
const subjects=()=>[...new Set([...['A','B'].flatMap(w=>Object.values(SCHEDULE[w]||{}).flat()).map(lessonName),...DEFAULT_SUBJECTS])];
const same=(a,b)=>{a=(a||'').toLowerCase().trim();b=(b||'').toLowerCase().trim();return !!a&&!!b&&(a===b||a.includes(b)||b.includes(a))};
const nextLesson=(sub,from)=>{for(let i=1;i<=14;i++){const d=addDays(from,i);if(lessonsOn(d).some(l=>lessonHas(l,sub)))return d}return null};
const hue=s=>{let h=0;for(const c of s||'?')h=(h*31+c.charCodeAt(0))%360;return h};
const dot=(s,m='mt-1.5')=>`<span class="inline-block w-2.5 h-2.5 rounded-full shrink-0 ${m}" style="background:hsl(${hue(s)} 80% 62%)"></span>`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dueLabel=s=>{if(!s)return'Без срока';const n=Math.round((fromYmd(s)-today())/864e5);return n<0?'Просрочено':n===0?'Сегодня':n===1?'Завтра':fmt(fromYmd(s))};
const fmtMin=m=>{const h=Math.floor(m/60),r=m%60;return h&&r?`${h} ч. ${r} мин.`:h?`${h} ч.`:`${r} мин.`};
const fmtClock=sec=>{const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),x=sec%60,p=n=>String(n).padStart(2,'0');return h?`${h}:${p(m)}:${p(x)}`:`${p(m)}:${p(x)}`};
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const saveHw=()=>store.set('sc_hw',S.hw);
const saveChat=()=>store.set('sc_chat',S.chat.slice(-40).map(({thumb,...m})=>m));
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.style.opacity=1;t.style.transform='translate(-50%,0)';clearTimeout(tt);tt=setTimeout(()=>{t.style.opacity=0;t.style.transform='translate(-50%,12px)'},2400)};

applySchedule();
/* ---------- ИИ через Google Gemini API ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fatal=m=>Object.assign(new Error(m),{fatal:true});
const httpMsg=(s,m,model)=>/location is not supported/i.test(m)?'Gemini API недоступен в вашем регионе. Нужен VPN или другой способ доступа.'
  :s===400&&/API key/i.test(m)?'Неверный API-ключ Gemini. Проверьте ключ в настройках ниже.'
  :s===401||s===403?'Ключ Gemini отклонён или не имеет доступа [HTTP '+s+']. Проверьте ключ в настройках ниже.'
  :s===404?'Модель «'+model+'» не найдена. Проверьте поле Jarvis Model в настройках ниже.'
  :s===429?'Достигнут лимит бесплатного тарифа Gemini. Подождите минуту и повторите.'
  :s>=500?'Серверы Gemini перегружены [HTTP '+s+']. Повторите позже.'
  :'Ошибка Gemini [HTTP '+s+']: '+m;
function toInline(url){
  const m=/^data:([^;,]+);base64,(.+)$/.exec(url||'');
  if(!m||!IMG_OK.test(m[1]))throw fatal('Этот формат фото не поддерживается. Используйте JPEG, PNG, WebP или HEIC.');
  return{inlineData:{mimeType:m[1].toLowerCase().replace('jpg','jpeg'),data:m[2]}};
}
// Внутренний формат сообщений -> формат Gemini (systemInstruction + contents с чередованием user/model)
function toGemini(messages){
  let system='';const contents=[];
  for(const m of messages){
    if(m.role==='system'){system+=(system?'\n':'')+m.content;continue}
    const role=m.role==='assistant'?'model':'user';
    const parts=(typeof m.content==='string'?[{text:m.content}]:m.content.map(p=>p.type==='image_url'?toInline(p.image_url.url):{text:p.text})).filter(p=>p.inlineData||p.text);
    if(!parts.length)continue;
    const last=contents[contents.length-1];
    if(last&&last.role===role)last.parts.push(...parts);else contents.push({role,parts});
  }
  while(contents.length&&contents[0].role!=='user')contents.shift();
  return{system,contents};
}
async function askGemini(messages,validate,opts={}){
  const key=S.key.replace(/[^\x21-\x7E]/g,'');
  if(!key)throw fatal('Не указан API-ключ Google Gemini. Вставьте его в настройках ниже.');
  const model=(S.model||DEFAULT_MODEL).trim().replace(/^models\//,'')||DEFAULT_MODEL;
  const{system,contents}=toGemini(messages);
  if(!contents.length)throw fatal('Пустой запрос.');
  const gc={temperature:.3,maxOutputTokens:8192};
  if(opts.json)gc.responseMimeType='application/json';
  if(/gemini-2\.5-flash/i.test(model))gc.thinkingConfig={thinkingBudget:0};
  const body=JSON.stringify({...(system?{systemInstruction:{parts:[{text:system}]}}:{}),contents,generationConfig:gc});
  const url=GEMINI_URL+encodeURIComponent(model)+':generateContent';
  let lastErr;
  for(let a=0;a<3;a++){
    if(a)await sleep(1200*a);
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),60000);
    try{
      const r=await fetch(url,{method:'POST',mode:'cors',credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:ctl.signal,headers:{'Content-Type':'application/json','x-goog-api-key':key},body});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){
        const msg=(j.error&&j.error.message)||'без описания';
        console.error('[Jarvis] '+model+' HTTP '+r.status+':',j);
        if([429,500,502,503,504].includes(r.status)){lastErr=fatal(httpMsg(r.status,msg,model));continue}
        throw fatal(httpMsg(r.status,msg,model));
      }
      const c=j.candidates&&j.candidates[0];
      const raw=((c&&c.content&&c.content.parts)||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('');
      if(!raw.trim()){
        console.error('[Jarvis] пустой ответ:',j);
        const br=j.promptFeedback&&j.promptFeedback.blockReason,fr=c&&c.finishReason;
        throw fatal(br||fr==='SAFETY'||fr==='RECITATION'?'Gemini отклонил этот запрос. Переформулируйте его или попробуйте другое фото.':'Gemini вернул пустой ответ. Попробуйте ещё раз.');
      }
      const v=validate(raw);
      if(v==null){console.error('[Jarvis] неподходящий ответ:',raw);throw fatal('Не удалось разобрать ответ Gemini. Попробуйте переформулировать.')}
      return v;
    }catch(e){
      if(e&&e.fatal)throw e;
      console.error('[Jarvis] сбой запроса:',e);
      if(e&&e.name==='AbortError')throw fatal('Gemini не ответил за 60 секунд. Проверьте соединение и повторите.');
      lastErr=fatal('Нет связи с Gemini API ['+((e&&e.message)||e)+']. '+(location.protocol==='file:'?'Страница открыта как file://. Откройте её по HTTPS или через WebView/локальный сервер.':'Проверьте интернет или VPN.'));
    }finally{clearTimeout(to)}
  }
  throw lastErr;
}
/* Бесплатная модель без ключа: публичный Pollinations (CORS открыт). Сначала POST, затем простой GET без preflight (самый надёжный путь для iOS Safari). */
const FREE_URL='https://text.pollinations.ai/';
const flat=c=>typeof c==='string'?c:c.filter(p=>p.type==='text').map(p=>p.text).join('\n');
async function freeFetch(url,opt){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),45000);
  try{return await fetch(url,{mode:'cors',credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:ctl.signal,...opt})}finally{clearTimeout(to)}
}
async function askFree(messages,validate){
  const msgs=messages.map(m=>({role:m.role,content:flat(m.content)})).filter(m=>m.content);
  let text='',status=0;
  try{
    const r=await freeFetch(FREE_URL+'openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:msgs,temperature:.3,private:true})});
    status=r.status;
    if(r.ok){const j=await r.json().catch(()=>({}));text=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||''}
  }catch(e){console.error('[Jarvis free POST]',e)}
  if(!text.trim()&&status!==429){
    try{
      const chat=msgs.filter(m=>m.role!=='system').slice(-6).map(m=>(m.role==='user'?'Ученик: ':'Jarvis: ')+m.content).join('\n')+'\nJarvis:';
      const sys='Ты Jarvis, ИИ-помощник SmartClass, создатель Ruslan H. Отвечай по-русски, кратко и по делу.';
      const r=await freeFetch(FREE_URL+encodeURIComponent(chat.slice(-800))+'?model=openai&private=true&system='+encodeURIComponent(sys),{method:'GET'});
      status=r.status;if(r.ok)text=await r.text();
    }catch(e){console.error('[Jarvis free GET]',e)}
  }
  if(!text.trim())throw new Error(status===429?'Бесплатный ИИ перегружен (лимит запросов). Подождите 15–20 секунд и повторите или переключитесь на Gemini.':'Бесплатный ИИ сейчас недоступен'+(status?' [HTTP '+status+']':'')+'. Проверьте интернет или переключитесь на Gemini в настройках.');
  const v=validate(text);if(v==null)throw new Error('Не удалось разобрать ответ ИИ. Попробуйте переформулировать.');return v;
}
const ask=(m,v,o)=>S.ai==='gemini'?askGemini(m,v,o):askFree(m,v);
function parseItems(raw){
  const hit=raw.match(/\{[\s\S]*\}|\[[\s\S]*\]/);if(!hit)return null;
  try{const p=JSON.parse(hit[0]);const items=Array.isArray(p)?p:p.items;return Array.isArray(items)?items:null}catch{return null}
}
function hwMessages(text){
  const t=today();
  const cal=Array.from({length:14},(_,i)=>{const d=addDays(t,i);return `${DAYS[d.getDay()]} ${ymd(d)}`}).join(', ');
  const sys=`${JARVIS_RU} Ты превращаешь заметки о домашнем задании в JSON. Сегодня ${DAYS_FULL[t.getDay()]}, ${ymd(t)}. Календарь на 2 недели: ${cal}. Известные предметы: ${subjects().join(', ')}.
Ответь ТОЛЬКО валидным JSON без markdown и без пояснений строго в таком виде: {"items":[{"subject":"строка","task":"строка","due":"ГГГГ-ММ-ДД или null"}]}
Правила: каждое отдельное задание — отдельный элемент; subject бери точно из списка известных предметов (например "матем" -> "Математика"); дни недели вроде "в пятницу" переводи в ближайшую такую дату из календаря ("завтра" = ${ymd(addDays(t,1))}); если срок не указан, due = null; task пиши кратко по-русски (например "упр. 5, стр. 10-12").`;
  return[{role:'system',content:sys},{role:'user',content:text}];
}
function chatMessages(){
  const t=today();
  const sys=`${JARVIS_RU} Ты умный и доброжелательный репетитор для школьника. Сегодня ${DAYS_FULL[t.getDay()]}, ${ymd(t)}. Отвечай по-русски, понятно и по шагам: сначала объясни идею, затем покажи решение, в конце коротко подведи итог. Если просят готовый ответ, помоги понять ход решения. Пиши кратко и без воды, выделяй главное **жирным**.`;
  const hist=S.chat.filter(m=>m.t&&!m.err).slice(-10).map(m=>({role:m.r==='u'?'user':'assistant',content:m.t}));
  return[{role:'system',content:sys},...hist];
}
function addItems(items){
  const t=today(),out=[];
  for(const it of items){
    const task=String(it.task||'').trim();if(!task)continue;
    let subject=String(it.subject||'Другое').trim();
    subject=subjects().find(s=>same(s,subject))||subject;
    let due=/^\d{4}-\d{2}-\d{2}$/.test(it.due||'')?it.due:null;
    if(!due){const n=nextLesson(subject,t);due=n?ymd(n):null}
    out.push({id:uid(),subject,task,due,done:false});
  }
  S.hw.push(...out);saveHw();return out;
}
function imageMessages(text,img){
  return[{role:'system',content:IMG_PROMPT},{role:'user',content:[{type:'image_url',image_url:{url:img}},{type:'text',text:text||'Разбери это фото: выпиши весь текст, предметы и задания.'}]}];
}
async function send(){
  const text=S.draft.trim(),img=S.img;if((!text&&!img)||S.busy)return;
  if(S.ai==='gemini'&&!S.key){toast('Сначала вставьте ключ Google Gemini ниже');return}
  if(S.ai!=='gemini'&&img){toast('Фото разбирает Gemini: выберите его и вставьте ключ');return}
  S.chat.push(img?{r:'u',t:text||'Фото расписания',img:true,thumb:img}:{r:'u',t:text});
  S.draft='';S.img=null;S.busy=true;saveChat();renderChat();
  try{
    if(img){
      const full=await ask(imageMessages(text,img),raw=>raw.trim()||null);
      S.chat.push({r:'a',t:full.trim()});
    }else{
      let handled=false;
      if(HW_WORDS.test(text)&&!ASK_WORDS.test(text)){
        const added=addItems(await ask(hwMessages(text),parseItems,{json:true}));
        if(added.length){S.chat.push({r:'a',items:added});handled=true}
      }
      if(!handled){const reply=await ask(chatMessages(),raw=>raw.trim()||null);S.chat.push({r:'a',t:reply.trim()})}
    }
  }catch(e){S.chat.push({r:'a',err:e.message})}
  S.busy=false;saveChat();renderChat();
}

function nowInfo(){
  const n=new Date(),sec=n.getHours()*3600+n.getMinutes()*60+n.getSeconds(),ls=lessonsOn(today());
  if(!BELLS.length||!hasSched())return{k:'setup'};
  if(!ls.length)return{k:'off'};
  for(let i=0;i<ls.length&&i<BELLS.length;i++){
    const s=mins(BELLS[i].start)*60,e=mins(BELLS[i].end)*60;
    if(sec>=s&&sec<e)return{k:'lesson',i,sub:lessonName(ls[i]),raw:ls[i],left:e-sec,total:e-s};
    if(sec<s)return{k:i?'break':'before',i,sub:lessonName(ls[i]),raw:ls[i],left:s-sec,total:i?s-mins(BELLS[i-1].end)*60:0};
  }
  return{k:'done'};
}

  return `<h2 class="text-[32px] font-bold tracking-tight px-1 mb-4">ИИ Помощник</h2>
  <div class="card p-4 mb-3"><div id="chat" class="space-y-3 mb-3 max-h-[46vh] overflow-y-auto"></div>
    <div id="attach"></div><input type="file" accept="image/*" id="schedule-photo-input" class="hidden"><div class="flex gap-2.5 items-center"><label for="schedule-photo-input" class="shrink-0 w-11 h-11 rounded-full bg-white/10 text-zinc-300 flex items-center justify-center cursor-pointer" aria-label="Прикрепить фото расписания"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></label><textarea id="inp" rows="1" placeholder="Напишите ДЗ или задайте вопрос" class="resize-none flex-1 min-w-0" style="padding:10px 14px;min-height:44px;max-height:120px;line-height:24px;border-radius:22px"></textarea><button data-a="send" class="shrink-0 w-11 h-11 rounded-full bg-blue-500 flex items-center justify-center" aria-label="Отправить"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></div>
  <h3 class="px-1 mt-8 mb-3 text-xl font-semibold tracking-tight">Настройки</h3>
  <div id="ai-card" class="card p-4 mb-3">${aiCard()}</div>
  <div class="rounded-3xl p-5 mb-3 border border-white/10 bg-gradient-to-br from-indigo-500/20 to-blue-500/10"><p class="text-xs uppercase tracking-wider text-blue-300 font-semibold mb-2 text-center">Класс</p><input id="cls" value="${esc(S.cls)}" placeholder="Например, 7А" autocomplete="off" class="text-center font-bold" style="font-size:28px!important;padding:14px;background:rgba(0,0,0,.35)"></div>
  <div id="bells-ed" class="card p-4 mb-3"></div>
  <div id="day-ed" class="card p-4 mb-3"></div>
  <div id="fc-card" class="card p-4 mb-3">${fcCard()}</div>
  <button data-a="clearChat" class="w-full card py-3.5 mb-3 text-blue-400 font-medium">Очистить чат</button>
  <button data-a="wipe" class="w-full card py-3.5 text-rose-400 font-medium">Удалить все ДЗ</button>
  <p class="text-center text-xs text-zinc-600 mt-5">Все данные хранятся только на этом устройстве.</p>`;
}
const fit=i=>{i.style.height='auto';i.style.height=Math.min(i.scrollHeight,120)+'px'};
const fileToDataUrl=f=>new Promise((res,rej)=>{
  const r=new FileReader();
  r.onerror=()=>rej(new Error('read'));
  r.onload=()=>{
    const im=new Image();
    im.onerror=()=>res(r.result);
    im.onload=()=>{
      const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas'),x=c.getContext('2d');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.85));
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);
});
function renderAttach(){
  const a=$('#attach');if(!a)return;
  a.innerHTML=S.img?`<div class="relative inline-block mb-2.5"><img src="${S.img}" alt="Прикреплённое фото" class="h-16 w-auto rounded-xl border border-white/10"><button data-a="rmimg" aria-label="Убрать фото" class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-zinc-600 text-white text-sm leading-none flex items-center justify-center">&times;</button></div>`:'';
}
function renderChat(){
  const c=$('#chat');if(!c)return;
  const bub='rounded-2xl rounded-bl-md px-3.5 py-2.5 text-sm max-w-[92%] break-words';
  const intro=`<div class="bg-zinc-800 ${bub}">Привет! Я Jarvis, помощник SmartClass. Напишите домашнее задание, например «упр. 5 по математике и стр. 10-12 по литературе к пятнице», и я добавлю его в список. Или задайте любой вопрос по учёбе. Кнопкой слева можно прикрепить фото расписания или домашнего задания, и я разберу его.</div>`;
  c.innerHTML=intro+S.chat.map(m=>m.r==='u'?`<div class="flex justify-end"><div class="bg-blue-500 rounded-2xl rounded-br-md px-3.5 py-2.5 text-sm max-w-[88%] break-words">${m.thumb?`<img src="${m.thumb}" alt="Фото расписания" class="rounded-xl mb-2 max-h-40 w-auto">`:''}${m.img&&m.t==='Фото расписания'?(m.thumb?'':'Фото расписания'):esc(m.t)}</div></div>`
   :m.err?`<div class="bg-rose-500/15 text-rose-300 ${bub}">${esc(m.err)}</div>`
   :m.items?`<div class="bg-zinc-800 ${bub}"><p class="font-semibold mb-1.5">Добавлено в список ДЗ: ${m.items.length}</p>${m.items.map(i=>`<div class="flex gap-2 py-0.5">${dot(i.subject)}<span><b>${esc(i.subject)}</b>: ${esc(i.task)} <span class="text-zinc-400">(${dueLabel(i.due).toLowerCase()})</span></span></div>`).join('')}</div>`
   :`<div class="bg-zinc-800 ${bub} leading-relaxed">${rich(m.t)}</div>`).join('')
   +(S.busy?`<div class="bg-zinc-800 ${bub} w-fit pulse">Jarvis думает…</div>`:'');
  c.scrollTop=c.scrollHeight;
  const i=$('#inp');if(i){i.value=S.draft;fit(i)}renderAttach();
}
function render(){
  document.querySelectorAll('nav [data-a=tab]').forEach(b=>{b.style.color=+b.dataset.id===S.tab?'#0a84ff':'#8e8e93'});
  $('#view').innerHTML=[vDash,vHw,vAI][S.tab]();
  if(S.tab===2){renderChat();renderEditors()}
  window.scrollTo(0,0);
}

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,h=S.hw.find(x=>x.id===id);
  if(a==='tab'){S.tab=+id;render()}
  else if(a==='done'&&h){h.done=!h.done;saveHw();render()}
  else if(a==='del'){S.hw=S.hw.filter(x=>x.id!==id);saveHw();render()}
  else if(a==='clearDone'){S.hw=S.hw.filter(x=>!x.done);saveHw();render()}
  else if(a==='addToggle'){S.adding=!S.adding;render()}
  else if(a==='addSave'){
    const sub=$('#m-sub').value.trim(),task=$('#m-task').value.trim(),due=$('#m-due').value||null;
    if(!sub||!task){toast('Укажите предмет и задание');return}
    S.hw.push({id:uid(),subject:subjects().find(s=>same(s,sub))||sub,task,due,done:false});saveHw();S.adding=false;render();toast('Задание добавлено');
  }
  else if(a==='ai'){S.ai=id;store.set('sc_ai',id);$('#ai-card').innerHTML=aiCard()}
  else if(a==='eW'){S.eW=id;renderEditors()}
  else if(a==='eD'){S.eD=+id;renderEditors()}
  else if(a==='bAdd'){const l=S.bells[S.bells.length-1],hm=m=>p2(Math.floor(m/60)%24)+':'+p2(m%60);let st='08:30';if(l&&/^\d{1,2}:\d{2}$/.test(l.e))st=hm(mins(l.e)+15);S.bells.push({s:st,e:hm(mins(st)+40)});saveBells();renderEditors()}
  else if(a==='bDel'){S.bells.splice(+id,1);saveBells();renderEditors()}
  else if(a==='lAdd'){dayArr().push('');saveSched();renderEditors();const q=document.querySelectorAll('[data-k=ls]');if(q.length)q[q.length-1].focus()}
  else if(a==='lDel'){dayArr().splice(+id,1);saveSched();renderEditors()}
  else if(a==='fcToggle'){S.fc=!S.fc;store.set('sc_fc',S.fc);$('#fc-card').innerHTML=fcCard();renderEditors();toast(S.fc?'Прогноз включён':'Прогноз скрыт')}
  else if(a==='shift'){S.shift=S.shift?0:1;store.set('sc_shift',S.shift);$('#fc-card').innerHTML=fcCard();toast('Недели A/B поменяны местами')}
  else if(a==='send')send();
  else if(a==='rmimg'){S.img=null;renderAttach()}
  else if(a==='eye'){S.showKey=!S.showKey;render()}
  else if(a==='clearChat'){S.chat=[];saveChat();renderChat();toast('Чат очищен')}
  else if(a==='wipe'&&confirm('Удалить все домашние задания?')){S.hw=[];saveHw();render()}
});
document.addEventListener('input',e=>{
  const i=e.target.id,k=e.target.dataset.k;
  if(k==='bs'||k==='be'){const b=S.bells[+e.target.dataset.i];if(b){b[k==='bs'?'s':'e']=e.target.value;saveBells()}}
  else if(k==='ls'){dayArr()[+e.target.dataset.i]=e.target.value;saveSched()}
  else if(i==='key'){S.key=e.target.value.trim();store.set('sc_key',S.key)}
  else if(i==='model'){S.model=e.target.value.trim();store.set('sc_model_v5',S.model)}
  else if(i==='cls'){S.cls=e.target.value;store.set('sc_class',S.cls)}
  else if(i==='inp'){S.draft=e.target.value;fit(e.target)}
});
document.addEventListener('change',async e=>{
  if(e.target.id!=='schedule-photo-input')return;
  const f=e.target.files&&e.target.files[0];e.target.value='';
  if(!f)return;
  try{S.img=await fileToDataUrl(f);renderAttach();toast('Фото прикреплено, нажмите отправить')}
  catch{toast('Не удалось прочитать изображение')}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.tab===0)render()});

/* ---------- иконка на экран «Домой» и запуск ---------- */
(()=>{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,180,180);
g.addColorStop(0,'#5e5ce6');g.addColorStop(1,'#0a84ff');x.fillStyle=g;x.fillRect(0,0,180,180);
x.strokeStyle='#fff';x.lineWidth=16;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(52,94);x.lineTo(80,122);x.lineTo(130,62);x.stroke();
$('#icon').href=c.toDataURL()})();
render();
setInterval(tick,1000);
</script>
</body>
</html>
