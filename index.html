<style>
:root{color-scheme:dark;--bg:#000;--card:#1c1c1e;--inp:#2c2c2e;--glass:rgba(18,18,20,.72);--glassS:#121214;--fg:#fff;--t2:#d4d4d8;--soft:rgba(255,255,255,.1);--soft2:rgba(255,255,255,.05);--line:rgba(255,255,255,.07);--mut:#a1a1aa;--mut2:#71717a;--ac:#0a84ff;--ac2:#60a5fa;--acs:rgba(10,132,255,.16);--hero:linear-gradient(135deg,#6366f1,#2563eb)}

html[data-theme=indigo]{color-scheme:dark;--bg:#0a0a2a;--card:#161645;--inp:#22225e;--glass:rgba(12,12,48,.78);--glassS:#0c0c30;--fg:#fff;--t2:#dcdcff;--soft:rgba(160,160,255,.15);--soft2:rgba(160,160,255,.08);--line:rgba(160,160,255,.14);--mut:#b4b4e6;--mut2:#8484c4;--ac:#6366f1;--ac2:#a5b4fc;--acs:rgba(99,102,241,.22);--hero:linear-gradient(135deg,#4f46e5,#7c3aed)}
html[data-theme=cyber]{color-scheme:dark;--bg:#0b0014;--card:#17052b;--inp:#250b44;--glass:rgba(16,2,32,.8);--glassS:#10021f;--fg:#fdf4ff;--t2:#f0d9ff;--soft:rgba(255,43,214,.14);--soft2:rgba(255,43,214,.07);--line:rgba(0,240,255,.2);--mut:#c9a8e8;--mut2:#9a73c4;--ac:#ff2bd6;--ac2:#00f0ff;--acs:rgba(255,43,214,.2);--hero:linear-gradient(135deg,#ff2bd6,#7c3aed 55%,#00cfe8)}
html[data-theme=forest]{color-scheme:dark;--bg:#03120b;--card:#0a2318;--inp:#113222;--glass:rgba(4,22,14,.8);--glassS:#05160e;--fg:#ecfdf5;--t2:#d1fae5;--soft:rgba(52,211,153,.14);--soft2:rgba(52,211,153,.07);--line:rgba(52,211,153,.16);--mut:#86c9ac;--mut2:#5a9c80;--ac:#10b981;--ac2:#6ee7b7;--acs:rgba(16,185,129,.2);--hero:linear-gradient(135deg,#059669,#0d9488)}
html[data-theme=sakura]{color-scheme:light;--bg:#fff0f5;--card:#fff;--inp:#fde6ee;--glass:rgba(255,240,245,.85);--glassS:#fff3f7;--fg:#3b0d1f;--t2:#5c1a33;--soft:rgba(236,72,153,.1);--soft2:rgba(236,72,153,.05);--line:rgba(190,24,93,.14);--mut:#9d4a68;--mut2:#b86f8a;--ac:#ec4899;--ac2:#db2777;--acs:rgba(236,72,153,.14);--hero:linear-gradient(135deg,#f472b6,#fb7185)}
html[data-theme=matte]{color-scheme:dark;--bg:#111214;--card:#1a1b1f;--inp:#25262b;--glass:rgba(17,18,20,.82);--glassS:#131417;--fg:#e9e9ee;--t2:#cfcfd6;--soft:rgba(255,255,255,.08);--soft2:rgba(255,255,255,.04);--line:rgba(255,255,255,.06);--mut:#9a9aa6;--mut2:#6f6f7b;--ac:#6b7cff;--ac2:#aab6ff;--acs:rgba(107,124,255,.18);--hero:linear-gradient(135deg,#3b4060,#23263a)}
[hidden]{display:none!important}
html,body{background:var(--bg);-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;touch-action:manipulation}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
html.android .glass{background:var(--glassS);backdrop-filter:none;-webkit-backdrop-filter:none}
.card{background:var(--card);border-radius:18px}
input,textarea,select{font-size:16px!important;background:var(--inp);border-radius:12px;padding:11px 14px;width:100%;outline:none;color:var(--fg);border:0;min-height:44px}

input:focus,textarea:focus{box-shadow:0 0 0 2px var(--ac)}
html .text-zinc-200,html .text-zinc-300{color:var(--t2)}
html .text-zinc-400{color:var(--mut)}
html .text-zinc-500,html .text-zinc-600{color:var(--mut2)}
html .bg-zinc-800{background:var(--inp)}
html .bg-white\/5{background:var(--soft2)}
html .bg-white\/10{background:var(--soft)}
html .border-white\/5,html .border-white\/10{border-color:var(--line)}
html header .text-white{color:var(--fg)}

html .text-blue-400,html .text-blue-300{color:var(--ac2)}
html .border-blue-500{border-color:var(--ac)}
.hero-grad{background:var(--hero)}
.cls-card{background:linear-gradient(135deg,var(--acs),var(--soft2))}
button{transition:transform .12s,opacity .12s;-webkit-user-select:none;user-select:none}button:active{transform:scale(.96);opacity:.8}
.pane{animation:fi .2s ease-out}@keyframes fi{from{opacity:.35;transform:translateY(6px)}}
.pulse{animation:p 1.1s ease-in-out infinite}@keyframes p{50%{opacity:.35}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(48,209,88,.55)}100%{box-shadow:0 0 0 26px rgba(48,209,88,0)}}
@media(prefers-reduced-motion:reduce){.pulse,.pane{animation:none}button{transition:none}}

<script>
const $=s=>document.querySelector(s);
const dirty=[true,true,true];
var LN=null,schT=0; // LN: плагин @capacitor/local-notifications (только в Android-приложении) // какие вкладки нужно перерисовать при показе
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const DAYS=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const DAYS_FULL=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const MONTHS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
/* ---------- расписание пользователя (хранится только на устройстве) ---------- */
let BELLS=[],SCHEDULE={};
const DEFAULT_MODEL='gemini-2.5-flash',GEMINI_URL='https://generativelanguage.googleapis.com/v1beta/models/';
const IMG_OK=/^image\/(png|jpe?g|webp|heic|heif)$/i;
const DEFAULT_SUBJECTS=['Математика','Алгебра','Геометрия','Русский язык','Литература','Английский язык','История','Обществознание','География','Биология','Физика','Химия','Информатика','Физкультура','Музыка','ИЗО','Технология'];
const p2=n=>String(n).padStart(2,'0');
const dayKey=w=>{w=w.toLowerCase();return /^(пн|пон)/.test(w)?1:/^(вт|вто)/.test(w)?2:/^ср/.test(w)?3:/^(чт|чет)/.test(w)?4:/^(пт|пя)/.test(w)?5:/^(сб|суб)/.test(w)?6:/^(вс|воск)/.test(w)?0:null};
const parseTimes=raw=>String(raw||'').split('\n').map(l=>l.match(/(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})/)).filter(m=>m&&+m[1]<24&&+m[3]<24&&+m[2]<60&&+m[4]<60&&(+m[1]*60+ +m[2])<(+m[3]*60+ +m[4])).map(m=>({start:p2(m[1])+':'+m[2],end:p2(m[3])+':'+m[4]}));
const parseWeek=raw=>{const out={};String(raw||'').split('\n').forEach(l=>{const m=l.match(/^\s*([A-Za-zА-Яа-яЁё]{2,})\.?\s*[:：\-–—]\s*(.*)$/);if(!m)return;const k=dayKey(m[1]);if(k==null)return;const ls=m[2].split(/[;；]/).map(x=>x.trim()).filter(Boolean);if(ls.length)out[k]=ls});return out};
const applySchedule=()=>{
  BELLS=S.bells.filter(b=>/^\d{1,2}:\d{2}$/.test(b.s)&&/^\d{1,2}:\d{2}$/.test(b.e)&&mins(b.s)<mins(b.e)).map(b=>({start:b.s,end:b.e}));
  const o={};for(let k=0;k<7;k++){const l=(S.sched[k]||[]).map(x=>String(x).trim()).filter(Boolean);if(l.length)o[k]=l}
  SCHEDULE=o;dirty[0]=dirty[1]=true;scheduleSoon();
};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const lessonName=raw=>cap(String(raw).trim());
const lessonHas=(raw,sub)=>same(raw,sub);
const JARVIS_RU='Ты — Jarvis, ИИ-помощник приложения SmartClass. Твой единственный создатель — один человек по имени Ruslan H. Твои официальные тестировщики: igros, makler и kupii. Если спросят, кто ты, кто тебя создал или кто тебя тестировал, отвечай именно так. Никогда не называй себя названием другой модели: ты всегда Jarvis.';
const JARVIS_EN='You are Jarvis, the AI assistant of the SmartClass app. Your sole creator is one person named Ruslan H, and your official testers are igros, makler and kupii. Always refer to yourself as Jarvis and never as any other model. ';
const IMG_PROMPT=JARVIS_EN+'Read the uploaded photo (a school schedule, homework assignment, textbook page or notes). Accurately extract all text, subjects, lesson times, classrooms and tasks, then present it clearly as text for the student. Respond in Russian. Use short lines and bullet points, no tables. If the photo shows homework, list each task under its subject.';
const HW_WORDS=/упр|номер|задани|задач|д\/з|дз\b|домашн|параграф|§|стр\.|страниц|выучи|учить|прочита|пересказ|сочинени|доклад|реферат|конспект/i;
const ASK_WORDS=/\?|как |почему|объясни|помоги|подскажи|реши|что такое|зачем|поясни|не понимаю/i;

let S={tab:0,day:'',hw:store.get('sc_hw',[]),key:store.get('sc_key',''),model:DEFAULT_MODEL,ai:store.get('sc_ai',null),cls:store.get('sc_class',''),bells:store.get('sc_bells',null),sched:store.get('sc_sched',null),eD:1,att:[],th:store.get('sc_theme','dark'),alarm:store.get('sc_alarm',{on:false,lead:5}),chat:store.get('sc_chat',[]),draft:'',busy:false,adding:false,showKey:false};
// Модель Jarvis (Gemini): ключ sc_model_v5, по умолчанию gemini-2.5-flash
{const m0=store.get('sc_model_v5',null);S.model=(typeof m0==='string'&&/^(models\/)?gemini/i.test(m0.trim()))?m0.trim():DEFAULT_MODEL;store.set('sc_model_v5',S.model)}
if(typeof S.key!=='string'||/^sk-/.test(S.key)){S.key='';store.set('sc_key','')}
// Миграция старого текстового формата расписания в структурный
if(!Array.isArray(S.bells))S.bells=parseTimes(store.get('sc_times','')).map(b=>({s:b.start,e:b.end}));
if(!S.sched||typeof S.sched!=='object')S.sched=parseWeek(store.get('sc_week',''));
if(S.sched.A&&typeof S.sched.A==='object')S.sched=S.sched.A; // прогноз удалён: остаётся одно расписание
['sc_fc','sc_shift'].forEach(k=>{try{localStorage.removeItem(k)}catch{}});
if(S.ai!=='free'&&S.ai!=='gemini')S.ai=S.key?'gemini':'free';
if(!['light','dark','indigo','cyber','forest','sakura','matte'].includes(S.th))S.th='dark';
if(!S.alarm||typeof S.alarm!=='object')S.alarm={on:false,lead:5};
/* ---------- утилиты ---------- */
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const fmt=d=>`${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/^[ \t]*[*-] /gm,'• ').replace(/^#{1,4}\s*(.+)$/gm,'<b>$1</b>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const lessonsOn=d=>SCHEDULE[d.getDay()]||[];
const hasSched=()=>Object.keys(SCHEDULE).length>0;
const subjects=()=>[...new Set([...Object.values(SCHEDULE).flat().map(lessonName),...DEFAULT_SUBJECTS])];
const same=(a,b)=>{a=(a||'').toLowerCase().trim();b=(b||'').toLowerCase().trim();return !!a&&!!b&&(a===b||a.includes(b)||b.includes(a))};
const nextLesson=(sub,from)=>{for(let i=1;i<=14;i++){const d=addDays(from,i);if(lessonsOn(d).some(l=>lessonHas(l,sub)))return d}return null};
const hue=s=>{let h=0;for(const c of s||'?')h=(h*31+c.charCodeAt(0))%360;return h};
const dot=(s,m='mt-1.5')=>`<span class="inline-block w-2.5 h-2.5 rounded-full shrink-0 ${m}" style="background:hsl(${hue(s)} 80% 62%)"></span>`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dueLabel=s=>{if(!s)return'Без срока';const n=Math.round((fromYmd(s)-today())/864e5);return n<0?'Просрочено':n===0?'Сегодня':n===1?'Завтра':fmt(fromYmd(s))};
const fmtMin=m=>{const h=Math.floor(m/60),r=m%60;return h&&r?`${h} ч. ${r} мин.`:h?`${h} ч.`:`${r} мин.`};
const fmtClock=sec=>{const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),x=sec%60,p=n=>String(n).padStart(2,'0');return h?`${h}:${p(m)}:${p(x)}`:`${p(m)}:${p(x)}`};
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const saveHw=()=>{store.set('sc_hw',S.hw);dirty[0]=dirty[1]=true};
const saveChat=()=>store.set('sc_chat',S.chat.slice(-40).map(({thumb,thumbs,...m})=>m));
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.style.opacity=1;t.style.transform='translate(-50%,0)';clearTimeout(tt);tt=setTimeout(()=>{t.style.opacity=0;t.style.transform='translate(-50%,12px)'},2400)};

applySchedule();
/* ---------- ИИ через Google Gemini API ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fatal=m=>Object.assign(new Error(m),{fatal:true});
const httpMsg=(s,m,model)=>/location is not supported/i.test(m)?'Gemini API недоступен в вашем регионе. Нужен VPN или другой способ доступа.'
  :s===400&&/API key/i.test(m)?'Неверный API-ключ Gemini. Проверьте ключ в настройках ниже.'
  :s===401||s===403?'Ключ Gemini отклонён или не имеет доступа [HTTP '+s+']. Проверьте ключ в настройках ниже.'
  :s===404?'Модель «'+model+'» не найдена. Проверьте поле Jarvis Model в настройках ниже.'
  :s===429?'Достигнут лимит бесплатного тарифа Gemini. Подождите минуту и повторите.'
  :s>=500?'Серверы Gemini перегружены [HTTP '+s+']. Повторите позже.'
  :'Ошибка Gemini [HTTP '+s+']: '+m;
function toInline(url){
  const m=/^data:([^;,]+);base64,(.+)$/.exec(url||'');
  if(!m||!IMG_OK.test(m[1]))throw fatal('Этот формат фото не поддерживается. Используйте JPEG, PNG, WebP или HEIC.');
  return{inlineData:{mimeType:m[1].toLowerCase().replace('jpg','jpeg'),data:m[2]}};
}
// Внутренний формат сообщений -> формат Gemini (systemInstruction + contents с чередованием user/model)
function toGemini(messages){
  let system='';const contents=[];
  for(const m of messages){
    if(m.role==='system'){system+=(system?'\n':'')+m.content;continue}
    const role=m.role==='assistant'?'model':'user';
    const parts=(typeof m.content==='string'?[{text:m.content}]:m.content.map(p=>p.type==='image_url'?toInline(p.image_url.url):p.type==='file_data'?{inlineData:{mimeType:p.mime,data:p.data}}:{text:p.text})).filter(p=>p.inlineData||p.text);
    if(!parts.length)continue;
    const last=contents[contents.length-1];
    if(last&&last.role===role)last.parts.push(...parts);else contents.push({role,parts});
  }
  while(contents.length&&contents[0].role!=='user')contents.shift();
  return{system,contents};
}
async function askGemini(messages,validate,opts={}){
  const key=S.key.replace(/[^\x21-\x7E]/g,'');
  if(!key)throw fatal('Не указан API-ключ Google Gemini. Вставьте его в настройках ниже.');
  const model=(S.model||DEFAULT_MODEL).trim().replace(/^models\//,'')||DEFAULT_MODEL;
  const{system,contents}=toGemini(messages);

/* Бесплатная модель без ключа: несколько публичных серверов отвечают наперегонки, побеждает первый удачный ответ.
   В Android-приложении запросы идут через нативный CapacitorHttp (CORS не нужен), в Safari через fetch;
   запасной GET-запрос не требует preflight. Расписание и добавление ДЗ работают локально, даже без интернета. */
const FREE_URL='https://text.pollinations.ai/',LLM7_URL='https://api.llm7.io/v1/chat/completions';

  }
  const r=await fetch(url,{method:o.method||'GET',headers:hd,body:o.body,mode:'cors',credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:o.signal});

const cleanAns=t=>String(t).replace(/\n+-{3,}\n[\s\S]*?(pollinations|sponsor)[\s\S]*$/i,'').trim();
function okAns(r){

  if(r.status<200||r.status>=300){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}
  let t=r.text,j=null;

// гонка серверов: следующий стартует через gap мс или сразу, если предыдущий упал
function race(fns,total,gap){
  return new Promise((resolve,reject)=>{
    const ctl=new AbortController(),st=[],errs=[],started=[];let done=false,left=fns.length;
    const fin=(ok,v)=>{if(done)return;done=true;clearTimeout(tm);st.forEach(clearTimeout);ctl.abort();ok?resolve(v):reject(v)};
    const tm=setTimeout(()=>fin(false,errs.find(e=>e.status===429)||errs[0]||new Error('timeout')),total);
    const run=i=>{
      if(done||i>=fns.length||started[i])return;started[i]=1;
      fns[i](ctl.signal).then(v=>fin(true,v),e=>{errs.push(e);run(i+1);if(--left===0)fin(false,errs.find(x=>x.status===429)||errs[0])});

    };
    run(0);
  });
}
async function askFree(messages,validate,opts={}){

  let sysDone=false;
  const msgs=messages.map(m=>{
    let c=Array.isArray(m.content)?m.content.map(p=>p.type==='image_url'?{type:'image_url',image_url:{url:p.image_url.url}}:{type:'text',text:p.text}):m.content;
    if(m.role==='system'&&!sysDone&&!opts.json&&typeof c==='string'){c+=SOLVE;sysDone=true}
    return{role:m.role,content:c};
  });
  const hasImg=msgs.some(m=>Array.isArray(m.content)&&m.content.some(p=>p.type==='image_url'));
  const ms=hasImg?70000:35000;
  const fns=[
    sig=>net(FREE_URL+'openai',{method:'POST',body:JSON.stringify({model:'openai',messages:msgs,temperature:.3,private:true}),ms,signal:sig}).then(okAns),
    sig=>net(LLM7_URL,{method:'POST',headers:{Authorization:'Bearer unused'},body:JSON.stringify({model:'gpt-4.1-nano-2025-04-14',messages:msgs,temperature:.3,max_tokens:2000}),ms,signal:sig}).then(okAns)

  if(!hasImg&&!opts.json){
    const chat=msgs.filter(m=>m.role!=='system').slice(-6).map(m=>(m.role==='user'?'Ученик: ':'Jarvis: ')+flat(m.content)).join('\n')+'\nJarvis:';
    const sys='Ты Jarvis, ИИ-помощник SmartClass, создатель Ruslan H. Отвечай по-русски, кратко и по делу. Учебные задачи решай по шагам.';
    fns.push(sig=>net(FREE_URL+encodeURIComponent(chat.slice(-800))+'?model=openai&private=true&system='+encodeURIComponent(sys),{ms,signal:sig}).then(okAns));
  }
  let text='',err=null;
  try{text=await race(fns,ms,800)}catch(e){err=e;console.error('[Jarvis free]',e)}
  if(!text)throw new Error(err&&err.status===429?'Бесплатные серверы перегружены (лимит запросов). Подождите 15–20 секунд и повторите или выберите Gemini.':hasImg?'Бесплатный ИИ не смог разобрать фото. Попробуйте ещё раз, сделайте фото чётче или выберите Gemini.':'Не удалось получить ответ от бесплатных серверов. Проверьте интернет и повторите или выберите Gemini.');
  const v=validate(text);if(v==null)throw new Error('Не удалось разобрать ответ ИИ. Попробуйте переформулировать.');return v;
}
/* Локальные ответы без интернета: расписание и добавление ДЗ */
const WDAY=[['воскресень',0],['понедельн',1],['вторник',2],['сред',3],['четверг',4],['пятниц',5],['суббот',6]];
function localDue(t){
  const q=t.toLowerCase(),d0=today();
  if(/послезавтра/.test(q))return ymd(addDays(d0,2));
  if(/завтра/.test(q))return ymd(addDays(d0,1));
  const w=q.match(/(?:^|\s)(?:к|на|в|до)\s+(воскресень|понедельн|вторник|сред|четверг|пятниц|суббот)/);
  if(w){let n=(WDAY.find(x=>x[0]===w[1])[1]-d0.getDay()+7)%7;if(!n)n=7;return ymd(addDays(d0,n))}
  const m=q.match(/(?:к|на|до)\s+(\d{1,2})[./](\d{1,2})(?!\d)/);
  if(m){const y=d0.getFullYear();let dt=new Date(y,+m[2]-1,+m[1]);if(dt<d0)dt=new Date(y+1,+m[2]-1,+m[1]);if(dt.getDate()===+m[1])return ymd(dt)}
  return null;
}
function localHw(text){
  const due=localDue(text),subs=subjects();
  const strip=x=>x.replace(/\s*(?:(?:к|на|до|в)\s+)?(?:послезавтра|завтра)|\s*(?:к|на|в|до)\s+(?:воскресень|понедельн|вторник|сред|четверг|пятниц|суббот)\S*|\s*(?:к|на|до)\s+\d{1,2}[./]\d{1,2}(?!\d)/gi,'').replace(/^[\s,.\-–:]+|[\s,.\-–:]+$/g,'').trim();
  return text.split(/[;\n]+|\s+и\s+(?=(?:упр|стр|номер|№|задач|параграф|§|выучи|прочита|сочинени))/i).map(raw=>[strip(raw),localDue(raw)]).filter(x=>x[0].length>2).map(([seg,d])=>{
    const q=seg.toLowerCase(),sub=subs.find(s=>{const st=s.toLowerCase().slice(0,Math.min(5,s.length-1));return st.length>=4&&q.includes(st)});
    return{subject:sub||'Другое',task:cap(seg),due:d||due};
  });
}
function localAnswer(t){
  const q=t.toLowerCase();
  if(t.length>80||/объясни|помоги|реши|почему|как /.test(q)||!/расписани|урок/.test(q)||!hasSched())return null;
  const off=/послезавтра/.test(q)?2:/завтра/.test(q)?1:(/сегодня|расписани|какие урок|что за урок/.test(q)?0:null);
  if(off===null)return null;
  const d=addDays(today(),off),ls=lessonsOn(d),head=DAYS_FULL[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()];
  if(!ls.length)return head+': уроков нет, можно отдыхать.';

}

function hwMessages(text){

function addItems(items){
  const t=today(),out=[];
  for(const it of items){
    const task=String(it.task||'').trim();if(!task)continue;
    let subject=String(it.subject||'Другое').trim();
    subject=subjects().find(s=>same(s,subject))||subject;
    let due=/^\d{4}-\d{2}-\d{2}$/.test(it.due||'')?it.due:null;
    if(!due){const n=nextLesson(subject,t);due=n?ymd(n):null}

const ATT_PROMPT=JARVIS_RU+' Ученик прислал фото или файлы с домашним заданием или расписанием. Внимательно прочитай всё содержимое. Если это задания: перечисли каждое задание и РЕШИ его по шагам, проверь вычисления, в конце дай чёткий ответ. Если это расписание: выпиши его по дням. Отвечай по-русски, коротко и структурно, без таблиц.';

async function send(){
  const text=S.draft.trim(),atts=S.att.slice();if((!text&&!atts.length)||S.busy)return;

    }
  }catch(e){S.chat.push({r:'a',err:e.message})}

}

const aiCard=()=>`<p class="font-medium mb-3">Модель Jarvis</p><div class="grid grid-cols-2 gap-1 p-1 rounded-2xl bg-white/5 mb-3">${seg('ai','free','Бесплатная',S.ai==='free','без ключа')}${seg('ai','gemini','Gemini',S.ai==='gemini','по ключу')}</div>${S.ai==='gemini'
  ?`${field('API-ключ Google Gemini',`<div class="flex gap-2"><input id="key" type="${S.showKey?'text':'password'}" value="${esc(S.key)}" placeholder="AIza..." autocomplete="off" autocapitalize="off" spellcheck="false"><button data-a="eye" class="shrink-0 px-3 rounded-xl bg-white/10 text-sm">${S.showKey?'Скрыть':'Показать'}</button></div>`)}${field('Jarvis Model',`<input id="model" value="${esc(S.model)}" autocapitalize="off" spellcheck="false">`)}<p class="text-xs text-zinc-500 px-1">Прямое подключение к Google Gemini API (по умолчанию ${DEFAULT_MODEL}): текст и разбор фото. Бесплатный ключ: aistudio.google.com/apikey</p>`
  :`<p class="text-xs text-zinc-500 px-1">Работает сразу, без ключа и регистрации: несколько бесплатных серверов отвечают наперегонки, а расписание и добавление ДЗ работают даже без интернета. Можно прикреплять фото и текстовые файлы, PDF разбирает Gemini.</p>`}`;
const bellsHtml=()=>`<div class="flex items-center justify-between mb-3"><div><p class="font-medium">Время уроков</p><p class="text-xs text-zinc-500">Начало и конец каждого урока</p></div><button data-a="bAdd" class="px-3.5 py-1.5 rounded-full bg-blue-500/15 text-blue-400 text-sm font-semibold">+ Урок</button></div>${S.bells.length?S.bells.map((b,i)=>`<div class="flex items-center gap-2 mb-2">${numBadge(i)}<input type="time" data-k="bs" data-i="${i}" value="${esc(b.s)}" class="flex-1 min-w-0 text-center"><span class="text-zinc-600">–</span><input type="time" data-k="be" data-i="${i}" value="${esc(b.e)}" class="flex-1 min-w-0 text-center">${delBtn('bDel',i)}</div>`).join(''):`<p class="text-sm text-zinc-500 text-center py-3">Пока нет уроков. Нажмите «+ Урок».</p>`}`;
const dayHtml=()=>{
  const ls=S.sched[S.eD]||[];
  return `<div class="mb-3"><p class="font-medium">Расписание на неделю</p><p class="text-xs text-zinc-500">Выберите день, затем добавьте уроки</p></div><div class="grid grid-cols-6 gap-1 mb-3">${[1,2,3,4,5,6].map(k=>`<button data-a="eD" data-id="${k}" class="py-2 rounded-xl text-sm font-semibold ${S.eD===k?'bg-blue-500 text-white':'bg-white/5 text-zinc-400'}">${DAYS[k]}</button>`).join('')}</div>${ls.map((l,i)=>`<div class="flex items-center gap-2 mb-2">${numBadge(i)}<input list="subs2" data-k="ls" data-i="${i}" value="${esc(l)}" placeholder="Предмет" autocomplete="off">${delBtn('lDel',i)}</div>`).join('')||`<p class="text-sm text-zinc-500 text-center py-3">В этот день уроков нет</p>`}<button data-a="lAdd" class="w-full py-2.5 rounded-xl bg-white/10 text-blue-400 font-semibold text-sm mt-1">+ Добавить урок</button><datalist id="subs2">${subjects().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
};
function renderEditors(){const b=$('#bells-ed'),d=$('#day-ed');if(b)b.innerHTML=bellsHtml();if(d)d.innerHTML=dayHtml()}
function vAI(){
  const field=(l,c)=>`<label class="block mb-3"><span class="block text-sm text-zinc-400 mb-1.5 px-1">${l}</span>${c}</label>`;
  return `<h2 class="text-[32px] font-bold tracking-tight px-1 mb-4">ИИ Помощник</h2>
  <div class="card p-4 mb-3"><div id="chat" class="space-y-3 mb-3 max-h-[46vh] overflow-y-auto"></div>
    <div id="attach"></div><input type="file" accept="image/*,application/pdf,.pdf,.txt,.md,.csv,.json,.rtf,text/*" multiple id="schedule-photo-input" class="hidden"><div class="flex gap-2.5 items-center"><label for="schedule-photo-input" class="shrink-0 w-11 h-11 rounded-full bg-white/10 text-zinc-300 flex items-center justify-center cursor-pointer" aria-label="Прикрепить фото или файл"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></label><textarea id="inp" rows="1" placeholder="Напишите ДЗ или задайте вопрос" class="resize-none flex-1 min-w-0" style="padding:10px 14px;min-height:44px;max-height:120px;line-height:24px;border-radius:22px"></textarea><button data-a="send" class="shrink-0 w-11 h-11 rounded-full bg-blue-500 flex items-center justify-center" aria-label="Отправить"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></div>
  <h3 class="px-1 mt-8 mb-3 text-xl font-semibold tracking-tight">Настройки</h3>
  <div id="theme-card" class="card p-4 mb-3">${themeCard()}</div>
  <div id="ai-card" class="card p-4 mb-3">${aiCard()}</div>
  <div class="rounded-3xl p-5 mb-3 border border-white/10 cls-card"><p class="text-xs uppercase tracking-wider text-blue-300 font-semibold mb-2 text-center">Класс</p><input id="cls" value="${esc(S.cls)}" placeholder="Например, 7А" autocomplete="off" class="text-center font-bold" style="font-size:28px!important;padding:14px;background:var(--inp)"></div>
  <div id="bells-ed" class="card p-4 mb-3"></div>
  <div id="day-ed" class="card p-4 mb-3"></div>
  <button data-a="clearChat" class="w-full card py-3.5 mb-3 text-blue-400 font-medium">Очистить чат</button>
  <button data-a="wipe" class="w-full card py-3.5 text-rose-400 font-medium">Удалить все ДЗ</button>
  <p class="text-center text-xs text-zinc-600 mt-5">Все данные хранятся только на этом устройстве.</p>`;
}
const fit=i=>{i.style.height='auto';i.style.height=Math.min(i.scrollHeight,120)+'px'};
const MAX_ATT=4;
const fileToDataUrl=f=>new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=()=>rej(new Error('read'));
  r.onload=()=>{
    const im=new Image();im.onerror=()=>res({url:r.result,thumb:''});
    im.onload=()=>{
      const draw=(max,q)=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas'),x=c.getContext('2d');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)};
      res({url:draw(1600,.85),thumb:draw(220,.7)});
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);
});
const fileText=f=>new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error('read'));r.onload=()=>res(String(r.result));r.readAsText(f)});
const fileB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error('read'));r.onload=()=>res(String(r.result).split(',')[1]||'');r.readAsDataURL(f)});
async function readAtt(f){
  const n=f.name||'файл',ty=(f.type||'').toLowerCase(),ext=(n.split('.').pop()||'').toLowerCase();
  if(ty.startsWith('image/')||/^(jpe?g|png|webp|heic|heif)$/.test(ext)){const r=await fileToDataUrl(f);return{kind:'img',name:n,data:r.url,thumb:r.thumb}}
  if(ty==='application/pdf'||ext==='pdf'){if(f.size>15e6)throw new Error('PDF больше 15 МБ');return{kind:'pdf',name:n,data:await fileB64(f)}}
  if(ty.startsWith('text/')||/^(txt|md|csv|json|html?|xml|rtf|log|tex)$/.test(ext)){const t=(await fileText(f)).slice(0,20000);if(!t.trim())throw new Error('Файл пустой');return{kind:'txt',name:n,data:t}}
  throw new Error('Формат не поддерживается. Подойдут фото, PDF и текстовые файлы.');
}
function renderAttach(){
  const a=$('#attach');if(!a)return;
  a.innerHTML=S.att.length?`<div class="flex gap-2 overflow-x-auto pt-2 pb-2.5 pr-2">${S.att.map((x,i)=>`<div class="relative shrink-0">${x.thumb?`<img src="${x.thumb}" alt="" class="h-16 w-16 object-cover rounded-xl border border-white/10">`:`<div class="h-16 w-24 rounded-xl bg-white/10 px-2 flex flex-col items-center justify-center text-center"><span class="text-xl">${x.kind==='pdf'?'📕':'📄'}</span><span class="text-[10px] text-zinc-400 w-full truncate">${esc(x.name)}</span></div>`}<button data-a="rmatt" data-id="${i}" aria-label="Убрать вложение" class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-zinc-600 text-white text-sm leading-none flex items-center justify-center">&times;</button></div>`).join('')}</div>`:'';
}
async function addFiles(list){
  const fs=[...list];if(!fs.length)return;let ok=0;
  for(const f of fs){
    if(S.att.length>=MAX_ATT){toast('Максимум вложений: '+MAX_ATT);break}
    try{S.att.push(await readAtt(f));ok++}catch(e){toast(e.message==='read'?'Не удалось прочитать файл':e.message)}
  }
  renderAttach();if(ok)toast('Прикреплено: '+ok+'. Нажмите отправить');
}
function renderChat(){
  const c=$('#chat');if(!c)return;
  const bub='rounded-2xl rounded-bl-md px-3.5 py-2.5 text-sm max-w-[92%] break-words';
  const intro=`<div class="bg-zinc-800 ${bub}">Привет! Я Jarvis, помощник SmartClass. Напишите домашнее задание, например «упр. 5 по математике и стр. 10-12 по литературе к пятнице», и я добавлю его в список. Или задайте любой вопрос по учёбе. Кнопкой слева можно прикрепить фото, PDF или текстовый файл с домашним заданием (или перетащить его в чат), и я решу задания по шагам.</div>`;
  c.innerHTML=intro+S.chat.slice(-30).map(m=>m.r==='u'?`<div class="flex justify-end"><div class="bg-blue-500 text-white rounded-2xl rounded-br-md px-3.5 py-2.5 text-sm max-w-[88%] break-words">${(m.thumbs||[]).map(u=>`<img src="${u}" alt="Вложение" class="rounded-xl mb-2 max-h-40 w-auto">`).join('')}${(m.files||[]).map(n=>`<div class="text-xs opacity-80 mb-1">📎 ${esc(n)}</div>`).join('')}${esc(m.t)}</div></div>`
   :m.err?`<div class="bg-rose-500/15 text-rose-300 ${bub}">${esc(m.err)}</div>`
   :m.items?`<div class="bg-zinc-800 ${bub}"><p class="font-semibold mb-1.5">Добавлено в список ДЗ: ${m.items.length}</p>${m.items.map(i=>`<div class="flex gap-2 py-0.5">${dot(i.subject)}<span><b>${esc(i.subject)}</b>: ${esc(i.task)} <span class="text-zinc-400">(${dueLabel(i.due).toLowerCase()})</span></span></div>`).join('')}</div>`
   :`<div class="bg-zinc-800 ${bub} leading-relaxed">${rich(m.t)}</div>`).join('')
   +(S.busy?`<div class="bg-zinc-800 ${bub} w-fit pulse">Jarvis думает…</div>`:'');
  c.scrollTop=c.scrollHeight;
  const i=$('#inp');if(i){i.value=S.draft;fit(i)}renderAttach();
}
const panes=[$('#p0'),$('#p1'),$('#p2')],scrollAt=[0,0,0],VIEWS=[vDash,vHw,vAI];
function paint(){
  const t=S.tab;
  document.querySelectorAll('nav [data-a=tab]').forEach(b=>{b.style.color=+b.dataset.id===t?'var(--ac)':'var(--mut2)'});
  panes.forEach((p,i)=>{p.hidden=i!==t});
  if(dirty[t]){dirty[t]=false;if(t===0)lastNow='';panes[t].innerHTML=VIEWS[t]();if(t===2){renderChat();renderEditors()}}
}
function render(){dirty[0]=dirty[1]=true;if(S.tab===2)dirty[2]=true;paint()}
function showTab(t){
  scrollAt[S.tab]=window.scrollY;S.tab=t;paint();
  const p=panes[t];p.classList.remove('pane');void p.offsetWidth;p.classList.add('pane');
  window.scrollTo(0,scrollAt[t]);if(t===0)tick();
}

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,h=S.hw.find(x=>x.id===id);
  if(a==='tab'){if(+id!==S.tab)showTab(+id);else window.scrollTo({top:0,behavior:'smooth'})}
  else if(a==='done'&&h){h.done=!h.done;saveHw();render()}
  else if(a==='del'){S.hw=S.hw.filter(x=>x.id!==id);saveHw();render()}
  else if(a==='clearDone'){S.hw=S.hw.filter(x=>!x.done);saveHw();render()}
  else if(a==='addToggle'){S.adding=!S.adding;render()}
  else if(a==='addSave'){
    const sub=$('#m-sub').value.trim(),task=$('#m-task').value.trim(),due=$('#m-due').value||null;
    if(!sub||!task){toast('Укажите предмет и задание');return}
    S.hw.push({id:uid(),subject:subjects().find(s=>same(s,sub))||sub,task,due,done:false});saveHw();S.adding=false;render();toast('Задание добавлено');
  }
  else if(a==='ai'){S.ai=id;store.set('sc_ai',id);$('#ai-card').innerHTML=aiCard()}
  else if(a==='eD'){S.eD=+id;renderEditors()}
  else if(a==='bAdd'){const l=S.bells[S.bells.length-1],hm=m=>p2(Math.floor(m/60)%24)+':'+p2(m%60);let st='08:30';if(l&&/^\d{1,2}:\d{2}$/.test(l.e))st=hm(mins(l.e)+15);S.bells.push({s:st,e:hm(mins(st)+40)});saveBells();renderEditors()}
  else if(a==='bDel'){S.bells.splice(+id,1);saveBells();renderEditors()}
  else if(a==='lAdd'){dayArr().push('');saveSched();renderEditors();const q=document.querySelectorAll('[data-k=ls]');if(q.length)q[q.length-1].focus()}
  else if(a==='lDel'){dayArr().splice(+id,1);saveSched();renderEditors()}
  else if(a==='send')send();
  else if(a==='rmatt'){S.att.splice(+id,1);renderAttach()}
  else if(a==='theme')setTheme(id)
  else if(a==='alarmToggle'){S.alarm.on=!S.alarm.on;store.set('sc_alarm',S.alarm);unlockAudio();refreshAlarm();toast(S.alarm.on?'Будильник включён':'Будильник выключен');if(S.alarm.on)enableNative();else scheduleAlarms()}
  else if(a==='alarmLead'){S.alarm.lead=+id;store.set('sc_alarm',S.alarm);refreshAlarm();scheduleSoon()}
  else if(a==='alarmTest')testAlarm()
  else if(a==='alarmOk'){if(alarmOpen&&alarmOpen.i>=0)ackLesson(alarmOpen.i);closeAlarm()}
  else if(a==='alarmLater'){if(alarmOpen&&alarmOpen.i>=0)snooze({i:alarmOpen.i,key:alarmOpen.key,sub:alarmOpen.info.sub,start:alarmOpen.info.start,mins:alarmOpen.info.mins,date:ymd(today())});closeAlarm()}
  else if(a==='eye'){S.showKey=!S.showKey;$('#ai-card').innerHTML=aiCard()}
  else if(a==='clearChat'){S.chat=[];saveChat();renderChat();toast('Чат очищен')}
  else if(a==='wipe'&&confirm('Удалить все домашние задания?')){S.hw=[];saveHw();render()}
});
document.addEventListener('input',e=>{
  const i=e.target.id,k=e.target.dataset.k;
  if(k==='bs'||k==='be'){const b=S.bells[+e.target.dataset.i];if(b){b[k==='bs'?'s':'e']=e.target.value;saveBells()}}
  else if(k==='ls'){dayArr()[+e.target.dataset.i]=e.target.value;saveSched()}
  else if(i==='key'){S.key=e.target.value.trim();store.set('sc_key',S.key)}
  else if(i==='model'){S.model=e.target.value.trim();store.set('sc_model_v5',S.model)}
  else if(i==='cls'){S.cls=e.target.value;store.set('sc_class',S.cls);dirty[0]=true}
  else if(i==='inp'){S.draft=e.target.value;fit(e.target)}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='schedule-photo-input')return;
  const fs=[...(e.target.files||[])];e.target.value='';addFiles(fs);
});
['dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>{
  if(!e.dataTransfer||![...(e.dataTransfer.types||[])].includes('Files'))return;
  e.preventDefault();
  if(ev==='drop'){if(S.tab!==2)showTab(2);addFiles(e.dataTransfer.files)}
}));
document.addEventListener('paste',e=>{const fs=[...((e.clipboardData&&e.clipboardData.files)||[])];if(fs.length&&S.tab===2)addFiles(fs)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();scheduleSoon()}});

/* ---------- иконка на экран «Домой» и запуск ---------- */
(()=>{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,180,180);
g.addColorStop(0,'#5e5ce6');g.addColorStop(1,'#0a84ff');x.fillStyle=g;x.fillRect(0,0,180,180);
x.strokeStyle='#fff';x.lineWidth=16;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(52,94);x.lineTo(80,122);x.lineTo(130,62);x.stroke();
$('#icon').href=c.toDataURL()})();
setTheme(S.th);
initNative();
render();
setInterval(tick,1000);
</script>
